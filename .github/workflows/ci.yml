name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential g++

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip wheel setuptools ninja
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      # Regular (non-editable) install puts _C.so in site-packages. Imports must
      # not run with the repo checkout as cwd, or the source tree shadows it.
      - name: Build and install torch_tvarant
        env:
          MAX_JOBS: "2"
          CXX: g++
        run: |
          pip install pytest numpy
          pip install . --no-build-isolation --no-deps -v

      - name: Smoke import installed package
        working-directory: ${{ runner.temp }}
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          python - <<'PY'
          import inspect
          import torch_tvarant
          print("torch_tvarant", inspect.getfile(torch_tvarant))
          print("backend", torch_tvarant._C.backend())
          PY

      - name: Run tests
        working-directory: ${{ runner.temp }}
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          pytest "${{ github.workspace }}/tests" -v \
            --ignore="${{ github.workspace }}/tests/test_opencl.py"

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Ruff check
        run: ruff check torch_tvarant tests

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: pip install mkdocs-material mkdocs

      - name: Build MkDocs site
        run: mkdocs build --strict
