name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential g++
          python -m pip install --upgrade pip wheel setuptools ninja build pytest numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"
          CXX=g++ pip install . --no-build-isolation --no-deps -v

      # Run outside the checkout so the source tree does not shadow site-packages.
      - name: Run tests before release
        working-directory: ${{ runner.temp }}
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          pytest "${{ github.workspace }}/tests" -v \
            --ignore="${{ github.workspace }}/tests/test_opencl.py"

      # Ship sdist only: the C++ extension must compile against the user's local
      # torch install. Platform wheels linked to CI torch are not portable.
      - name: Build sdist
        run: python -m build --sdist --no-isolation

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}

      - name: Publish to PyPI
        # Trusted Publishing (OIDC) — no API token. Requires a PyPI pending/active
        # publisher for project "torch-tvarant", workflow release.yml, this repo.
        uses: pypa/gh-action-pypi-publish@release/v1
