name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools ninja build pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"
          pip install -e . --no-build-isolation --no-deps -v

      - name: Run tests before release
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: pytest tests/ -v --ignore=tests/test_opencl.py

      # Ship sdist only: the C++ extension must compile against the user's local
      # torch install. Platform wheels linked to CI torch are not portable.
      - name: Build sdist
        run: python -m build --sdist --no-isolation

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
