name: Mark stale issues

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had
            no activity for 60 days. It will be closed in 14 days if no further
            activity occurs. Comment to keep it open.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has had no activity for 45 days. It will be closed in 14 days if no
            further activity occurs.
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          exempt-issue-labels: "pinned,security,enhancement"
          exempt-pr-labels: "pinned,work-in-progress"
